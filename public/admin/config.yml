backend:
  name: github
  repo: haruchanz64/haruchanz64.github.io
  branch: main
  base_url: https://haru-portfolio.haruchanz64.workers.dev
  auth_endpoint: api/auth

media_folder: public/res/uploads
public_folder: /res/uploads

x-locale-fields: &locale_fields
  - label: Meta
    name: meta
    widget: object
    collapsed: true
    fields:
      - { label: Page Title, name: title, widget: string }
      - { label: Meta Description, name: description, widget: text }

  - label: Navigation
    name: nav
    widget: object
    collapsed: true
    fields:
      - { label: ARIA Label, name: ariaLabel, widget: string }
      - { label: Logo ARIA Label, name: logoAriaLabel, widget: string }
      - { label: Brand Name, name: brandName, widget: string }
      - { label: Brand Role, name: brandRole, widget: string }
      - label: Links
        name: links
        widget: object
        fields:
          - { label: About, name: about, widget: string }
          - { label: Experience, name: experience, widget: string }
          - { label: Education, name: education, widget: string }
          - { label: Projects, name: projects, widget: string }
          - { label: Skills, name: skills, widget: string }
          - { label: Contact, name: contact, widget: string }

  - label: Hero
    name: hero
    widget: object
    collapsed: true
    fields:
      - { label: Logo Alt Text, name: logoAlt, widget: string }
      - { label: Greeting, name: greeting, widget: string }
      - { label: Name, name: name, widget: string }
      - { label: Title (HTML), name: titleHtml, widget: text }
      - { label: Primary CTA, name: ctaContact, widget: string }
      - { label: Secondary CTA, name: ctaProjects, widget: string }

  - label: About
    name: about
    widget: object
    collapsed: true
    fields:
      - { label: Section Title, name: title, widget: string }
      - { label: Paragraph 1 (HTML), name: p1Html, widget: text }
      - { label: Origin Modal Title, name: haruOriginTitle, widget: string }
      - { label: Origin Modal Close, name: haruOriginClose, widget: string }
      - { label: Origin Modal Body (HTML), name: haruOriginHtml, widget: text }
      - { label: Paragraph 2 (HTML), name: p2Html, widget: text }
      - { label: Paragraph 3 (HTML), name: p3Html, widget: text }
      - { label: Paragraph 4 (HTML), name: p4Html, widget: text }

  - label: Experience
    name: experience
    widget: object
    collapsed: true
    fields:
      - { label: Section Title, name: title, widget: string }
      - label: Items
        name: items
        widget: object
        fields:
          - label: Item 0
            name: "0"
            widget: object
            fields:
              - { label: Role, name: role, widget: string }
              - { label: Date, name: date, widget: string }
              - { label: Company, name: company, widget: string }
              - { label: Location, name: location, widget: string }
              - { label: Bullet 0, name: b0, widget: text }
              - { label: Bullet 1, name: b1, widget: text }
              - { label: Bullet 2, name: b2, widget: text }
              - { label: Bullet 3, name: b3, widget: text }
          - label: Item 1
            name: "1"
            widget: object
            fields:
              - { label: Role, name: role, widget: string }
              - { label: Date, name: date, widget: string }
              - { label: Company, name: company, widget: string }
              - { label: Location, name: location, widget: string }
              - { label: Bullet 0, name: b0, widget: text }
              - { label: Bullet 1, name: b1, widget: text }
              - { label: Bullet 2, name: b2, widget: text }
              - { label: Bullet 3, name: b3, widget: text }
          - label: Item 2
            name: "2"
            widget: object
            fields:
              - { label: Role, name: role, widget: string }
              - { label: Date, name: date, widget: string }
              - { label: Company, name: company, widget: string }
              - { label: Location, name: location, widget: string }
              - { label: Bullet 0, name: b0, widget: text }
              - { label: Bullet 1, name: b1, widget: text }
              - { label: Bullet 2, name: b2, widget: text }
          - label: Item 3
            name: "3"
            widget: object
            fields:
              - { label: Role, name: role, widget: string }
              - { label: Date, name: date, widget: string }
              - { label: Company, name: company, widget: string }
              - { label: Location, name: location, widget: string }
              - { label: Bullet 0, name: b0, widget: text }
              - { label: Bullet 1, name: b1, widget: text }
              - { label: Bullet 2, name: b2, widget: text }

  - label: Education
    name: education
    widget: object
    collapsed: true
    fields:
      - { label: Section Title, name: title, widget: string }
      - label: Items
        name: items
        widget: object
        fields:
          - label: Item 0
            name: "0"
            widget: object
            fields:
              - { label: Degree, name: degree, widget: string }
              - { label: Date, name: date, widget: string }
              - { label: Major, name: major, widget: string }
              - { label: School, name: school, widget: string }
              - { label: Location, name: location, widget: string }
              - { label: Bullet 0, name: b0, widget: text }
              - { label: Bullet 1, name: b1, widget: text }
              - { label: Bullet 2, name: b2, widget: text }

  - label: Projects Labels
    name: projects
    widget: object
    collapsed: true
    fields:
      - { label: Section Title, name: title, widget: string }
      - { label: Systems & Tools Heading, name: systemsTools, widget: string }
      - { label: Game Projects Heading, name: gameProjects, widget: string }
      - { label: Loading Text, name: loading, widget: string }
      - { label: None Found Text, name: noneFound, widget: string }
      - { label: None Games Found Text, name: noneGamesFound, widget: string }
      - { label: No Description Text, name: noDescription, widget: string }
      - { label: Failed To Load Text, name: failedToLoad, widget: string }
      - { label: Untitled Text, name: untitled, widget: string }
      - { label: Game Alt Text, name: gameAlt, widget: string }

  - label: Skills Labels
    name: skills
    widget: object
    collapsed: true
    fields:
      - { label: Section Title, name: title, widget: string }
      - { label: ARIA Label, name: ariaLabel, widget: string }
      - label: Tabs
        name: tabs
        widget: object
        fields:
          - { label: Programming Languages, name: languages, widget: string }
          - { label: Frameworks, name: frameworks, widget: string }
          - { label: Game Engines, name: gameEngines, widget: string }
          - { label: Databases, name: databases, widget: string }
          - { label: Tools & Software, name: tools, widget: string }

  - label: Contact
    name: contact
    widget: object
    collapsed: true
    fields:
      - { label: Section Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - label: Form
        name: form
        widget: object
        fields:
          - { label: Name Label, name: nameLabel, widget: string }
          - { label: Name Placeholder, name: namePlaceholder, widget: string }
          - { label: Email Label, name: emailLabel, widget: string }
          - { label: Email Placeholder, name: emailPlaceholder, widget: string }
          - { label: Subject Label, name: subjectLabel, widget: string }
          - { label: Subject Placeholder, name: subjectPlaceholder, widget: string }
          - label: Subjects
            name: subjects
            widget: object
            fields:
              - { label: Freelance, name: freelance, widget: string }
              - { label: Job, name: job, widget: string }
              - { label: Collaboration, name: collab, widget: string }
              - { label: General, name: general, widget: string }
              - { label: Custom, name: custom, widget: string }
          - { label: Custom Subject Placeholder, name: customSubjectPlaceholder, widget: string }
          - { label: Custom Subject ARIA Label, name: customSubjectAriaLabel, widget: string }
          - { label: Message Label, name: messageLabel, widget: string }
          - { label: Message Placeholder, name: messagePlaceholder, widget: string }
          - { label: Submit Button, name: submit, widget: string }
          - { label: Sending Button, name: sending, widget: string }
          - { label: Resume Button, name: resume, widget: string }
          - { label: Generating Resume Button, name: generatingResume, widget: string }
          - { label: Download Resume Button, name: downloadResume, widget: string }
          - { label: Close Resume Preview, name: closeResumePreview, widget: string }
          - { label: Resume Modal Title, name: resumeModalTitle, widget: string }
      - { label: Social Title, name: socialTitle, widget: string }
      - label: Toast Messages
        name: toast
        widget: object
        fields:
          - { label: Enter Name, name: enterName, widget: string }
          - { label: Invalid Email, name: invalidEmail, widget: string }
          - { label: Select Subject, name: selectSubject, widget: string }
          - { label: Enter Custom Subject, name: enterCustomSubject, widget: string }
          - { label: Enter Message, name: enterMessage, widget: string }
          - { label: Sent, name: sent, widget: string }
          - { label: Offline, name: offline, widget: string }
          - { label: Dev Mode, name: devMode, widget: string }
          - { label: Generic Error, name: genericError, widget: string }
          - { label: Timeout, name: timeout, widget: string }
          - { label: Endpoint Unavailable, name: endpointUnavailable, widget: string }
          - { label: Server Error, name: serverError, widget: string }

  - label: Footer
    name: footer
    widget: object
    collapsed: true
    fields:
      - { label: Copyright, name: copyright, widget: string }

collections:
  - name: locales
    label: Site Content (Locales)
    files:
      - label: English (en_us)
        name: en_us
        file: src/locales/en_us.json
        format: json
        fields: *locale_fields
      - label: Filipino (fil_ph)
        name: fil_ph
        file: src/locales/fil_ph.json
        format: json
        fields: *locale_fields
      - label: Japanese (ja_jp)
        name: ja_jp
        file: src/locales/ja_jp.json
        format: json
        fields: *locale_fields
